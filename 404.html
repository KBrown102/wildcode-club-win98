<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到文件 · 野码</title>
<style>
  html { background: #008080; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "SimSun", "宋体", monospace;
  }
  .box {
    width: 340px;
    max-width: 88vw;
    background: #C0C0C0;
    border: 2px solid;
    border-color: #DFDFDF #000 #000 #DFDFDF;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, .4);
  }
  .tb {
    height: 20px;
    padding: 0 4px;
    line-height: 20px;
    background: #000080;
    color: #fff;
    font-size: 12px;
  }
  .bd {
    padding: 18px 16px 14px;
    font-size: 12px;
    line-height: 1.75;
    color: #000;
  }
  .ft {
    padding: 0 14px 14px;
    text-align: right;
  }
  .ft a {
    display: inline-block;
    padding: 3px 16px;
    background: #C0C0C0;
    border: 1px solid;
    border-color: #fff #000 #000 #fff;
    box-shadow: inset 1px 1px 0 #DFDFDF, inset -1px -1px 0 #808080;
    color: #000;
    text-decoration: none;
    font-size: 12px;
  }
  .ft a:active {
    border-color: #000 #fff #fff #000;
    box-shadow: inset 1px 1px 0 #808080;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="tb">野码 · 文件错误</div>
    <div class="bd">找不到这个文件。<br>可能是链接过期了，也可能这个目录本来就没放东西。</div>
    <div class="ft"><a href="/">回桌面</a></div>
  </div>
</body>
</html>
