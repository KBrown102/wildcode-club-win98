<style>

<script>
(function(){
'use strict';
var VF = window.VF, VFR = window.VFR;
var W = VF.W, H = VF.H;
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var $ = function(id){ return document.getElementById(id); };

// ---------- 缩放：canvas CSS 固定，整体只交给 #stage 的 transform ----------
var eff = 1, K = 1;
function fit(){
  K = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = 'scale(' + K + ')';
  var dpr = window.devicePixelRatio || 1;
  eff = Math.min(Math.max(1, dpr * K), 2.1);
  var bw = Math.round(W * eff), bh = Math.round(H * eff);
  if (cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
  ctx.setTransform(eff, 0, 0, eff, 0, 0);
}
window.addEventListener('resize', fit);

// ---------- 胶片颗粒（一次性烘焙成 CSS 背景，不占每帧开销） ----------
(function(){
  var c = document.createElement('canvas'); c.width = c.height = 96;
  var x = c.getContext('2d'), d = x.createImageData(96,96);
  for (var i=0;i<d.data.length;i+=4){ var v = 120 + Math.random()*135|0; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  x.putImageData(d,0,0);
  $('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
})();

// ---------- 存档 ----------
var SKEY = 'vf290save';
var save = { best: [], star: [], unlocked: 1 };
try { var raw = localStorage.getItem(SKEY); if (raw) save = JSON.parse(raw); } catch(e){}
if (!save.best || save.best.length < 8) save.best = [0,0,0,0,0,0,0,0];
if (!save.star || save.star.length < 8) save.star = [0,0,0,0,0,0,0,0];
if (!save.unlocked) save.unlocked = 1;
var muted = !!save.muted;
function persist(){ save.muted = muted; try{ localStorage.setItem(SKEY, JSON.stringify(save)); }catch(e){} }

// ---------- 音频 ----------
var AC = null, master = null;
function ac(){
  if (!AC){
    var A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    AC = new A(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
var PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
function tone(semi, dur, type, gain, delay){
  if (muted) return; var a = ac(); if (!a) return;
  var t0 = a.currentTime + (delay || 0);
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.value = 440 * Math.pow(2, (semi - 9) / 12);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.14, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
}
var NB = null;
function noiseBurst(dur, gain, freq){
  if (muted) return; var a = ac(); if (!a) return;
  if (!NB){
    NB = a.createBuffer(1, a.sampleRate * 0.3, a.sampleRate);
    var d = NB.getChannelData(0);
    for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1);
  }
  var s = a.createBufferSource(); s.buffer = NB;
  var f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1800; f.Q.value = 1.1;
  var g = a.createGain();
  var t0 = a.currentTime;
  g.gain.setValueAtTime(gain || 0.22, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.02);
}
function sfxShutter(){ noiseBurst(0.055, 0.30, 2400); tone(33, 0.06, 'square', 0.05, 0); }
function sfxGrade(gd, combo){
  var n = PENT[Math.min(PENT.length-1, 2 + gd*2 + (combo||0))];
  if (gd >= 3){ tone(n, 0.5, 'sine', 0.16, 0.04); tone(n+12, 0.42, 'sine', 0.07, 0.07); }
  else if (gd >= 2) tone(n, 0.26, 'sine', 0.11, 0.03);
  else if (gd >= 1) tone(n-5, 0.18, 'triangle', 0.07, 0.02);
  else tone(14, 0.16, 'triangle', 0.06, 0.02);
}
function sfxEmpty(){ tone(7, 0.13, 'triangle', 0.06, 0); }
function sfxBonus(){ tone(16, 0.2, 'sine', 0.12, 0); tone(23, 0.26, 'sine', 0.10, 0.09); }
function sfxTick(s){ if (muted) return; tone(28 + Math.round(s*10), 0.045, 'sine', 0.022, 0); }
function sfxOver(star){
  var seq = star >= 1 ? [0,4,7,12] : [0,-1,-3];
  seq.forEach(function(n,i){ tone(PENT[Math.min(9,2+i*2)] + (star>=1?0:-5), 0.5, 'sine', 0.10, i*0.14); });
}

// ---------- 状态 ----------
var st = null, mode = 'title', flash = 0, lastTick = 0, lastS = 0;
var thumbs = [];

function setLevel(i){ st = VF.create(i); thumbs = []; $('album').innerHTML = ''; syncHud(); }

function syncHud(){
  $('lvname').textContent = st.cfg.name;
  $('task').innerHTML = '主题 · <span style="color:var(--acc)">' + VF.KINDS[st.cfg.theme].n + '</span>' +
    (st.themeDone ? ' ✓' : '');
  $('tgt').textContent = VF.TARGET[st.lv];
  $('score').textContent = st.score;
  var fh = '';
  for (var i=0;i<st.filmMax;i++) fh += '<div class="fsq' + (i < st.film ? '' : ' off') + '"></div>';
  $('film').innerHTML = fh;
}

function addThumb(f, grade){
  var c = document.createElement('canvas'); c.width = 56; c.height = 84;
  var x = c.getContext('2d');
  x.drawImage(cv, Math.round(f.x*eff), Math.round(f.y*eff), Math.round(f.w*eff), Math.round(f.h*eff), 0, 0, 56, 84);
  thumbs.push({ c: c, grade: grade });
  var img = document.createElement('canvas');
  img.width = 28; img.height = 42; img.className = 'thumb' + (grade >= 3 ? ' g3' : '');
  img.getContext('2d').drawImage(c, 0, 0, 28, 42);
  (function(cc){ img.addEventListener('click', function(){ ac(); tone(PENT[4], 0.2, 'sine', 0.08, 0); }); })(c);
  $('album').appendChild(img);
  return img;
}

// ---------- 输入 ----------
var keys = {};
function keyOf(e){
  var c = e.code || '', k = (e.key || '').toLowerCase();
  if (c === 'ArrowLeft' || k === 'arrowleft' || k === 'a' || c === 'KeyA') return 'L';
  if (c === 'ArrowRight' || k === 'arrowright' || k === 'd' || c === 'KeyD') return 'R';
  if (c === 'ArrowUp' || k === 'arrowup' || k === 'w' || c === 'KeyW') return 'U';
  if (c === 'ArrowDown' || k === 'arrowdown' || k === 's' || c === 'KeyS') return 'D';
  if (c === 'Space' || k === ' ' || k === 'spacebar' || c === 'Enter' || k === 'enter') return 'S';
  return '';
}
window.addEventListener('keydown', function(e){
  var k = keyOf(e);
  if (!k) return;
  if (k === 'S'){
    e.preventDefault();
    if (mode === 'play') doShoot();
    return;
  }
  keys[k] = true; e.preventDefault();
}, {passive:false});
window.addEventListener('keyup', function(e){ var k = keyOf(e); if (k && k !== 'S'){ keys[k] = false; e.preventDefault(); } }, {passive:false});
window.addEventListener('blur', function(){
  for (var k in keys) delete keys[k];
  held.dz = 0; held.dy = 0; drag = null;
});

var held = { dz:0, dy:0 };
function bindHold(el, dz, dy){
  var on = function(e){ e.preventDefault(); held.dz += dz; held.dy += dy; };
  var off = function(e){ e.preventDefault(); held.dz -= dz; held.dy -= dy; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindHold($('bU'), 0, -1);
bindHold($('bD'), 0, 1);
bindHold($('bP'), 1, 0);
bindHold($('bM'), -1, 0);

function doShoot(){
  if (!st || st.phase !== 'play') return;
  var f = VF.frameOf(st);
  VF.shoot(st);
  // 事件处理后立即抓缩略图
  var ev = st.events[st.events.length-1];
  if (ev && ev.t === 'shot'){
    addThumb(f, ev.grade);
    flash = 1;
  }
}
$('bShut').addEventListener('pointerdown', function(e){ e.preventDefault(); doShoot(); });

// 画布拖动：横向 -> 变焦，纵向 -> 升降；轻点 -> 快门
var drag = null;
cv.addEventListener('pointerdown', function(e){
  if (mode !== 'play') return;
  drag = { x:e.clientX, y:e.clientY, t:performance.now(), moved:0, dz:0, dy:0 };
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', function(e){
  if (!drag || mode !== 'play') return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  // 横向拖 = 变焦（相对增量），纵向拖 = 框心（绝对跟随）
  var nz = dx / 160, ny = dy;
  st.z = VF.clamp01(st.z + (nz - drag.dz)); drag.dz = nz;
  st.fcy += (ny - drag.dy); drag.dy = ny;
  VF.clampFrame(st);
});
cv.addEventListener('pointerup', function(e){
  if (!drag) return;
  if (drag.moved < 9 && performance.now() - drag.t < 420) doShoot();
  drag = null;
});
cv.addEventListener('pointercancel', function(){ drag = null; });

// ---------- 主循环 ----------
var last = performance.now();
function loop(now){
  var dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;

  if (mode === 'play' && st.phase === 'play'){
    var inp = { dz:0, dy:0 };
    if (keys.L) inp.dz -= 1;
    if (keys.R) inp.dz += 1;
    if (keys.U) inp.dy -= 1;
    if (keys.D) inp.dy += 1;
    inp.dz += held.dz; inp.dy += held.dy;
    inp.dz = VF.clamp(inp.dz, -1, 1); inp.dy = VF.clamp(inp.dy, -1, 1);

    VF.update(st, dt, inp);            // ① 先 update

    for (var i=0;i<st.events.length;i++){   // ② 再消费事件播音效
      var ev = st.events[i];
      if (ev.t === 'shot'){ sfxShutter(); sfxGrade(ev.grade, st.combo); }
      else if (ev.t === 'empty') sfxEmpty();
      else if (ev.t === 'bonus') sfxBonus();
      else if (ev.t === 'over'){ sfxOver(ev.star); endGame(); }
    }
    st.events.length = 0;

    if (st.live){
      var s = st.live.s;
      if (Math.abs(s - lastS) > 0.05 && now - lastTick > 130){ lastTick = now; sfxTick(s); }
      lastS = s;
    } else lastS = 0;

    // HUD
    $('live').classList.add('on');
    if (st.live){
      $('lname').textContent = st.live.o.K.n;
      $('lscore').textContent = st.live.s.toFixed(2);
      $('lbar').style.width = Math.round(st.live.s * 100) + '%';
      $('lgrade').textContent = st.live.s >= VF.S_PERFECT ? '合 景' :
        (st.live.s >= VF.S_GOOD ? '很 好' : (st.live.s >= VF.S_OKAY ? '还 行' : (st.live.s > 0 ? '再 调' : '装不下')));
    } else {
      $('lname').textContent = '框内无景';
      $('lscore').textContent = '—';
      $('lbar').style.width = '0%';
      $('lgrade').textContent = '';
    }
    $('score').textContent = st.score;
    $('task').innerHTML = '主题 · <span style="color:var(--acc)">' + VF.KINDS[st.cfg.theme].n + '</span>' +
      (st.themeDone ? ' ✓' : '');
    var fh = '';
    for (var fi=0; fi<st.filmMax; fi++) fh += '<div class="fsq' + (fi < st.film ? '' : ' off') + '"></div>';
    $('film').innerHTML = fh;
    $('bShut').classList.toggle('hot', !!(st.live && st.live.s >= VF.S_PERFECT));
  }

  if (st){
    VFR.drawWorld(ctx, st);                 // ③ 再渲染
    if (mode === 'play' || st.phase === 'over') VFR.drawFrame(ctx, st, flash);
    if (flash > 0) flash = Math.max(0, flash - dt * 5.2);
  }
  requestAnimationFrame(loop);
}

// ---------- 流程 ----------
function show(id){ ['ovStart','ovSel','ovEnd'].forEach(function(k){ $(k).classList.toggle('hide', k !== id); }); }
function hideAll(){ ['ovStart','ovSel','ovEnd'].forEach(function(k){ $(k).classList.add('hide'); }); }

function buildGrid(){
  var html = '';
  for (var i=0;i<VF.LEVELS.length;i++){
    var lock = (i + 1) > save.unlocked;
    var s = save.star[i] || 0;
    var stars = ''; for (var k=0;k<3;k++) stars += (k < s ? '★' : '☆');
    html += '<div class="card' + (lock ? ' lock' : '') + '" data-i="' + i + '">' +
      '<div class="n">' + (i+1) + '</div>' +
      '<div class="t">' + VF.LEVELS[i].name + '</div>' +
      '<div class="s">' + (lock ? '　' : stars) + '</div>' +
      '<div class="b">' + (lock ? '未解锁' : (save.best[i] || 0)) + '</div></div>';
  }
  $('grid').innerHTML = html;
  Array.prototype.forEach.call($('grid').children, function(el){
    el.addEventListener('click', function(){
      var i = +el.getAttribute('data-i');
      if ((i+1) > save.unlocked) return;
      startLevel(i);
    });
  });
}

function startLevel(i){
  ac();
  setLevel(i);
  mode = 'play'; hideAll();
  $('album').innerHTML = '';
}
function endGame(){
  mode = 'end';
  var tgt = VF.TARGET[st.lv];
  var star = st.star;
  if (st.score > (save.best[st.lv] || 0)) save.best[st.lv] = st.score;
  if (star > (save.star[st.lv] || 0)) save.star[st.lv] = star;
  if (st.pass && st.lv + 2 > save.unlocked) save.unlocked = Math.min(8, st.lv + 2);
  persist();
  $('endTitle').textContent = st.cfg.name + ' · 拍完了';
  var sTxt = ''; for (var k=0;k<3;k++) sTxt += (k < star ? '★' : '☆');
  $('endStars').textContent = sTxt;
  $('endScore').textContent = st.score + ' 分 · 目标 ' + tgt + (st.pass ? '' : '（未过）');
  var p = st.shots.filter(function(x){ return x.grade === 3; }).length;
  $('endSub').textContent = st.shots.length + ' 张 · 完美 ' + p + ' 张' +
    (st.themeDone ? '' : ' · 未拍到主题景「' + VF.KINDS[st.cfg.theme].n + '」');
  var box = $('endShots'); box.innerHTML = '';
  thumbs.forEach(function(t){
    var d = document.createElement('canvas');
    d.width = 56; d.height = 84;
    if (t.grade >= 3) d.className = 'g3';
    d.getContext('2d').drawImage(t.c, 0, 0);
    box.appendChild(d);
  });
  var missMap = {};
  st.missed.forEach(function(m){ missMap[m.name] = (missMap[m.name]||0) + 1; });
  var keys2 = Object.keys(missMap);
  $('endMiss').innerHTML = keys2.length
    ? '错过：' + keys2.map(function(k){ return k + (missMap[k]>1 ? '×'+missMap[k] : ''); }).join(' · ')
    : '一个都没落下。';
  $('bNext').style.display = (st.lv + 1 < VF.LEVELS.length && (st.lv + 2) <= save.unlocked) ? '' : 'none';
  show('ovEnd');
}

$('bStart').addEventListener('click', function(){
  startLevel(Math.min(VF.LEVELS.length - 1, Math.max(0, save.unlocked - 1)));
});
$('bSel').addEventListener('click', function(){ buildGrid(); show('ovSel'); });
$('bSel2').addEventListener('click', function(){ buildGrid(); show('ovSel'); });
$('bBack').addEventListener('click', function(){ show('ovStart'); });
$('bRetry').addEventListener('click', function(){ startLevel(st.lv); });
$('bNext').addEventListener('click', function(){ startLevel(Math.min(VF.LEVELS.length-1, st.lv+1)); });
$('bHome').addEventListener('click', function(){ mode='title'; buildGrid(); show('ovSel'); });
$('bMute').addEventListener('click', function(){
  muted = !muted; persist();
  $('bMute').textContent = muted ? '✕' : '♪';
  $('bMute').style.color = muted ? 'rgba(239,231,218,.4)' : '';
});

// ---------- 启动 ----------
fit();
setLevel(0);
$('bMute').textContent = muted ? '✕' : '♪';
$('bMute').style.color = muted ? 'rgba(239,231,218,.4)' : '';
window.__game = {
  get st(){ return st; }, get mode(){ return mode; }, get eff(){ return eff; }, get K(){ return K; },
  VF: VF, VFR: VFR, startLevel: startLevel, shoot: doShoot,
  setZoom: function(z){ st.z = VF.clamp01(z); VF.clampFrame(st); },
  setFcy: function(y){ st.fcy = y; VF.clampFrame(st); },
  press: function(k){ keys[k] = true; }, release: function(k){ keys[k] = false; },
  keyOf: keyOf, get keys(){ return keys; },
  save: save, cv: cv, stage: stage
};
requestAnimationFrame(loop);
})();
</script>
