<!DOCTYPE html>
<html lang="zh-CN">
<head><script>window.__wc_noctx__=1;document.addEventListener("contextmenu",function(e){e.preventDefault()},{capture:true});</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>暗绿 · 一笺光</title>
<style>
  :root{
    --bg:#0a120c; --room:#0f1b12; --green:#2f4a32; --green2:#3a5a3e;
    --warm:#C4553B; --warm-soft:#e8c98a; --ink:#d9e4d6; --ghost:#1c2a1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#05080a;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    color:var(--ink); user-select:none;}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:900px;height:560px;background:var(--bg);
    box-shadow:0 0 120px rgba(0,0,0,.7) inset, 0 0 60px rgba(0,0,0,.6);overflow:hidden;}
  canvas{position:absolute;inset:0;display:block;}
  /* UI 层 */
  .ui{position:absolute;left:0;right:0;pointer-events:none;z-index:5;}
  #top{top:0;display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;font-size:15px;letter-spacing:.04em;
    text-shadow:0 1px 6px rgba(0,0,0,.8);}
  #top .title{color:var(--ink);opacity:.85;font-weight:600;}
  #top .meta{opacity:.6;font-size:13px;}
  #top .score b{color:var(--warm-soft);font-weight:700;}
  #hint{position:absolute;top:50px;left:0;right:0;text-align:center;font-size:12.5px;
    opacity:.42;letter-spacing:.06em;}
  #letter{position:absolute;left:0;right:0;bottom:0;padding:16px 26px 22px;
    font-size:18px;line-height:1.7;letter-spacing:.05em;text-align:center;
    background:linear-gradient(to top, rgba(6,12,8,.92), rgba(6,12,8,0));
    text-shadow:0 1px 8px rgba(0,0,0,.9);}
  #letter .done{color:var(--warm-soft);}
  #letter .rest{color:rgba(217,228,214,.18);}
  #letter .blink{color:var(--warm);animation:bl 1.1s infinite;}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:.9}}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(196,85,59,.5);
    color:var(--warm-soft);background:rgba(196,85,59,.08);border-radius:999px;
    padding:9px 22px;font-size:14px;letter-spacing:.08em;transition:.18s;}
  .btn:hover{background:rgba(196,85,59,.22);}
  #tools{position:absolute;right:18px;bottom:84px;display:flex;gap:10px;z-index:6;}
  /* 遮罩层 */
  .cover{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;pointer-events:auto;
    background:radial-gradient(circle at 50% 45%, rgba(15,27,18,.92), rgba(5,8,10,.98));
    transition:opacity .6s;}
  .cover h1{font-size:30px;letter-spacing:.18em;margin:0 0 6px;color:var(--ink);font-weight:600;}
  .cover .sub{font-size:14px;opacity:.5;letter-spacing:.14em;margin-bottom:26px;}
  .cover p{font-size:14px;opacity:.62;line-height:1.9;max-width:560px;margin:4px 24px;}
  .cover.hide{opacity:0;pointer-events:none;}
  #win .stars{font-size:46px;letter-spacing:.1em;margin:10px 0 6px;}
  #win .ws{color:var(--warm);}
  #win .wo{color:rgba(217,228,214,.16);}
  #win .line{font-size:20px;color:var(--warm-soft);line-height:1.8;letter-spacing:.05em;
    margin:14px 26px;max-width:600px;}
  #win .ws2{font-size:13px;opacity:.5;margin-top:18px;}
  .toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    font-size:15px;color:var(--warm);opacity:0;pointer-events:none;z-index:8;
    text-shadow:0 1px 10px rgba(0,0,0,.9);transition:opacity .25s;}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="cv" width="900" height="560"></canvas>

  <div class="ui" id="top">
    <div class="title">暗绿 · 一笺光</div>
    <div class="meta">第 <span id="lv">1</span> 夜 · <span id="nmeta">4 笺</span></div>
    <div class="score">心绪 <b id="score">0</b></div>
  </div>
  <div id="hint">移动光照亮信笺，按读起来通顺的顺序，轻点它，把句子连回去</div>

  <div class="ui" id="letter"><span class="done"></span><span class="rest"></span></div>

  <div id="tools">
    <div class="btn" id="restart">重燃</div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 开场 -->
  <div class="cover" id="intro">
    <h1>暗 绿 · 一 笺 光</h1>
    <div class="sub">那爱绿的一间夜室</div>
    <p>房间很暗，绿得很安静。你手里只有一小团暖光。</p>
    <p>把光挪到墙上，旧时的字会浮起来；停下，它们又会慢慢退回暗里。</p>
    <p>按读起来顺的句子顺序，轻轻点下每一笺——把一封被忘记的信，连回去。</p>
    <div class="btn" id="startBtn" style="margin-top:30px">轻轻开始</div>
  </div>

  <!-- 通关 -->
  <div class="cover hide" id="win">
    <h1 id="winTitle">这一夜，读完了</h1>
    <div class="stars" id="winStars"></div>
    <div class="line" id="winLine"></div>
    <div class="ws2" id="winSub"></div>
    <div class="btn" id="nextBtn" style="margin-top:24px">下一夜</div>
  </div>
</div></div>

<script src="js/game.js"></script>
<script>
(function(){
  var G = window.GreenGlow;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = G.W, H = G.H;
  // 适配 dpr
  var dpr = Math.max(1, Math.min(2.6, window.devicePixelRatio||1));
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.scale(dpr,dpr);

  // 适配视口（整个舞台等比缩放）
  var stage = document.getElementById('stage');
  function fit(){
    var sc = Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform = 'scale('+sc+')';
    stage.style.transformOrigin = 'center center';
  }
  window.addEventListener('resize', fit); fit();

  var game = new G.Game(0);
  var started = false, last = 0;

  // —— 输入：指针 → 光目标；落点命中节点 → tap ——
  var pointer = {x:W/2,y:H/2,down:false};
  function toLocal(e){
    var r = stage.getBoundingClientRect();
    var sc = r.width / W;
    var px = (e.clientX - r.left)/sc;
    var py = (e.clientY - r.top)/sc;
    return {x:px, y:py};
  }
  function setTarget(e){
    var p = toLocal(e);
    pointer.x = p.x; pointer.y = p.y;
    game.target.x = p.x; game.target.y = p.y;
    game.input.tx = p.x; game.input.ty = p.y;
  }
  stage.addEventListener('pointermove', function(e){ if(started) setTarget(e); });
  stage.addEventListener('pointerdown', function(e){
    if(!started) return;
    var p = toLocal(e); pointer.x=p.x; pointer.y=p.y;
    game.target.x=p.x; game.target.y=p.y; game.input.tx=p.x; game.input.ty=p.y;
    // 命中检测：取最近的已显形节点
    var best=-1, bd=1e9;
    for(var i=0;i<game.nodes.length;i++){
      var n=game.nodes[i];
      if(n.connected) continue;
      var d=Math.hypot(n.x-p.x,n.y-p.y);
      if(d<bd){bd=d;best=i;}
    }
    if(best>=0 && bd<34 && game.nodes[best].lit>G.TAP_LIT*0.8){
      game.input.tap = best;
    }
  });

  // —— 事件处理 ——
  var toastEl = document.getElementById('toast');
  var toastT = 0;
  function toast(msg){ toastEl.textContent=msg; toastEl.style.opacity=1; toastT=0.9; }
  function drainEvents(){
    for(var i=0;i<game.events.length;i++){
      var ev=game.events[i];
      if(ev.type==='connect'){ toast('「'+ev.frag.trim()+'」'); }
      else if(ev.type==='wrong'){ toast('还不通顺…'); }
      else if(ev.type==='win'){ onWin(); }
    }
    game.events.length=0;
  }

  // —— UI 更新 ——
  var elLv=document.getElementById('lv'), elN=document.getElementById('nmeta'),
      elScore=document.getElementById('score'),
      elDone=document.querySelector('#letter .done'), elRest=document.querySelector('#letter .rest');
  function updateUI(){
    elLv.textContent = game.level+1;
    elN.textContent = game.N+' 笺';
    elScore.textContent = game.score;
    // 句子进度：已连成 + 待连（淡）
    var done='';
    for(var i=0;i<game.chain.length;i++) done += game.nodes[game.chain[i]].frag;
    elDone.textContent = done;
    var rest = game.win ? '' : ' <span class="blink">…</span>';
    elRest.innerHTML = rest;
  }

  // —— 渲染 ——
  function draw(){
    // 夜室底
    var bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0c1610'); bg.addColorStop(1,'#070d09');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // 暗绿纹理：几缕极淡的绿雾
    ctx.save();
    ctx.globalAlpha=0.05; ctx.fillStyle='#2f4a32';
    for(var s=0;s<5;s++){
      ctx.beginPath();
      ctx.ellipse(150+s*160, 120+((s*97)%300), 180, 120, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // 已连成的链
    if(game.chain.length>1){
      ctx.save();
      ctx.strokeStyle='rgba(196,85,59,0.5)'; ctx.lineWidth=2;
      ctx.shadowColor='rgba(196,85,59,0.6)'; ctx.shadowBlur=12;
      ctx.beginPath();
      for(var c=0;c<game.chain.length;c++){
        var cn=game.nodes[game.chain[c]];
        if(c===0) ctx.moveTo(cn.x,cn.y); else ctx.lineTo(cn.x,cn.y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 节点（信笺）
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<game.nodes.length;i++){
      var n=game.nodes[i];
      var a = n.connected ? 1 : (0.04 + n.lit*0.96);
      if(a<0.02) continue;
      // 节点光晕（已连：暖；未连：随显形度微亮）
      if(n.lit>0.05 || n.connected){
        var gr = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,46);
        var col = n.connected ? '196,85,59' : '232,201,138';
        gr.addColorStop(0,'rgba('+col+','+(0.12+0.22*Math.min(1,n.lit))+')');
        gr.addColorStop(1,'rgba('+col+',0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(n.x,n.y,46,0,Math.PI*2); ctx.fill();
      }
      // 文字
      ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = n.connected ? 'rgba(232,201,138,0.95)' : 'rgba(217,228,214,'+a+')';
      ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=6;
      ctx.fillText(n.frag, n.x, n.y);
      ctx.shadowBlur=0;
    }

    // 光（唯一暖点）
    var lx=game.light.x, ly=game.light.y, r=game.radius();
    var lg = ctx.createRadialGradient(lx,ly,0,lx,ly,r);
    lg.addColorStop(0,'rgba(232,201,138,'+(0.30+0.30*game.light.power)+')');
    lg.addColorStop(0.55,'rgba(196,85,59,'+(0.12+0.12*game.light.power)+')');
    lg.addColorStop(1,'rgba(196,85,59,0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(lx,ly,r,0,Math.PI*2); ctx.fill();
    // 光心
    ctx.fillStyle='rgba(255,240,210,'+(0.5+0.4*game.light.power)+')';
    ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2); ctx.fill();
  }

  // —— 主循环 ——
  function loop(t){
    if(!last) last=t;
    var dt=(t-last)/1000; last=t;
    if(dt>0.05) dt=0.05;
    if(started && game.status==='play'){
      game.step(dt);
      drainEvents();
    }
    if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.style.opacity=0; }
    draw();
    updateUI();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // —— 开场 / 通关 ——
  var intro=document.getElementById('intro');
  document.getElementById('startBtn').addEventListener('click', function(){
    intro.classList.add('hide'); started=true; last=0;
  });
  document.getElementById('restart').addEventListener('click', function(){
    game.reset(game.level); started=true; last=0;
    document.getElementById('win').classList.add('hide');
  });
  function onWin(){
    started=false;
    var win=document.getElementById('win');
    var st=game.stars();
    var sHtml='';
    for(var i=0;i<3;i++) sHtml += (i<st)?'<span class="ws">●</span>':'<span class="wo">○</span>';
    document.getElementById('winStars').innerHTML=sHtml;
    document.getElementById('winLine').textContent = game.letterSoFar();
    var last = game.level>=G.LEVELS-1;
    document.getElementById('winTitle').textContent = last? '信，读完了' : '这一夜，读完了';
    document.getElementById('winSub').textContent = last
      ? '绿房间还暖着。灯，我替你收好了。' : ('余光 '+Math.round(game.light.power*100)+'% · 越从容，星越多');
    document.getElementById('nextBtn').textContent = last? '再读一遍' : '下一夜';
    win.classList.remove('hide');
  }
  document.getElementById('nextBtn').addEventListener('click', function(){
    var last = game.level>=G.LEVELS-1;
    game.reset(last? 0 : game.level+1);
    started=true; last=0;
    document.getElementById('win').classList.add('hide');
  });
})();
</script>
</body>
</html>
