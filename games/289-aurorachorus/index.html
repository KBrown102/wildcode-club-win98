<style>

<script>
(function () {
  'use strict';
  var G = window.AuroraGame, R = window.AuroraRender;
  R.bind(G);

  var W = 480, H = 800;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var stage = document.getElementById('stage'), wrap = document.getElementById('wrap');

  // ---------- 存档 ----------
  var KEY = 'aurorachorus.v1';
  var save = { unlocked: 1, stars: [0, 0, 0, 0, 0], best: [0, 0, 0, 0, 0], chain: 0, mute: false };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); for (var kk in save) if (o[kk] !== undefined) save[kk] = o[kk]; }
  } catch (e) { }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { } }

  // ---------- 音效：五声音阶 ----------
  var AC = null, master = null;
  var PENTA = [0, 2, 4, 7, 9];
  function actx() {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
      master = AC.createGain();
      master.gain.value = 0.20;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function hz(semi) { return 261.6256 * Math.pow(2, semi / 12); }
  function tone(semi, dur, type, vol, delay) {
    if (save.mute) return;
    var a = actx(); if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(hz(semi), t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.5 : vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, f, q, vol) {
    if (save.mute) return;
    var a = actx(); if (!a) return;
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = a.createBufferSource(); src.buffer = buf;
    var bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q || 1.2;
    var g = a.createGain(); g.gain.value = vol === undefined ? 0.3 : vol;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(a.currentTime);
  }
  function sfxLock(n) {
    var i = Math.max(0, n - 1);
    var s = PENTA[i % 5] + 12 * Math.floor(i / 5);
    tone(s, 0.34, 'sine', 0.42);
    tone(s + 12, 0.20, 'triangle', 0.12);
  }
  function sfxMiss() { noise(0.20, 190, 0.8, 0.28); tone(-21, 0.22, 'sine', 0.20); }
  function sfxLaunch() { noise(0.13, 2400, 2.2, 0.16); }
  function sfxBig(len) {
    for (var i = 0; i < 5; i++) tone(PENTA[i] + (len >= 8 ? 12 : 0), 0.5, 'sine', 0.30, i * 0.055);
  }
  function sfxRefund() { tone(7, 0.22, 'triangle', 0.30); tone(12, 0.28, 'triangle', 0.26, 0.09); }
  function sfxTide() { tone(0, 0.7, 'sine', 0.20); tone(7, 0.7, 'sine', 0.14, 0.05); tone(12, 0.9, 'sine', 0.12, 0.1); }
  function sfxClear() {
    [0, 4, 7, 12, 16, 19].forEach(function (s, i) { tone(s, 0.75, 'sine', 0.30, i * 0.085); });
  }
  function sfxOver() { [12, 7, 2].forEach(function (s, i) { tone(s, 0.6, 'sine', 0.20, i * 0.13); }); }

  // ---------- 状态 ----------
  var st = null, mode = 'title', li = 0;
  var running = false, lastT = 0, endTimer = 0;

  function newRun(level) {
    li = level;
    st = G.newState(level, (Math.random() * 1e9) | 0);
    st.__cursorVisible = false;
    R.reset();
    mode = 'play';
    running = true;
    endTimer = 0;
    hideAll();
    syncHUD();
    hint('点亮的柱子越多越好 · 亮带在向右飘');
  }

  function hideAll() {
    ['ovStart', 'ovLevels', 'ovEnd'].forEach(function (id) {
      document.getElementById(id).classList.remove('on');
    });
  }

  var hintT = 0;
  function hint(t) {
    var el = document.getElementById('hHint');
    el.textContent = t; el.classList.add('on'); hintT = 3.2;
  }

  // ---------- HUD 同步 ----------
  var wvCache = -1;
  function syncHUD() {
    if (!st) return;
    document.getElementById('hLv').textContent = (li + 1);
    document.getElementById('hSc').textContent = st.score;
    document.getElementById('hCh').textContent = st.maxChain;
    var lit = st.lit, n = st.n;
    document.getElementById('hProg').style.width = (lit / n * 100) + '%';
    document.getElementById('hProgL').textContent = '点亮 ' + lit + ' / ' + n + '　余 ' + st.waves + ' 束';
    // 波束
    var box = document.getElementById('hWv');
    var total = Math.max(st.wavesMax, st.waves);
    if (wvCache !== total) {
      box.innerHTML = '';
      for (var i = 0; i < total; i++) {
        var d = document.createElement('div'); d.className = 'wd'; box.appendChild(d);
      }
      wvCache = total;
    }
    var ds = box.children;
    for (var j = 0; j < ds.length; j++) {
      var on = j < st.waves;
      if (ds[j].classList.contains('on') !== on) ds[j].classList.toggle('on', on);
    }
    // 合声潮
    var tp = 1 - Math.min(1, Math.max(0, st.tideT / G.LEVELS[li].tide));
    var tb = document.getElementById('hTide');
    tb.firstElementChild.style.width = (tp * 100).toFixed(1) + '%';
    tb.className = 'tide' + (st.tideOn ? ' on' : (st.tideWarn ? ' warn' : ''));
    var tl = document.getElementById('hTideL');
    tl.className = 'tidelabel' + (st.tideOn ? ' hot' : '');
    tl.textContent = st.tideOn ? '合 声 潮 · 现 在' : (st.tideWarn ? '合 声 潮 · 将 至' : '合声潮 · 蓄势');
  }

  // ---------- 输入 ----------
  var keys = {};
  function keyOf(e) { return (e.code || '') + '|' + (e.key || ''); }
  function isKey(e, code, key) {
    var c = e.code || '', k = e.key || '';
    if (c === code) return true;
    if (k === key) return true;
    if (k && k.length === 1 && k.toLowerCase() === key.toLowerCase()) return true;
    return false;
  }
  window.addEventListener('keydown', function (e) {
    var handled = false;
    if (isKey(e, 'ArrowLeft', 'a') || isKey(e, 'KeyA', 'a')) { keys.L = 1; handled = true; }
    if (isKey(e, 'ArrowRight', 'd') || isKey(e, 'KeyD', 'd')) { keys.R = 1; handled = true; }
    if (isKey(e, 'ArrowUp', 'w') || isKey(e, 'KeyW', 'w') || isKey(e, 'Space', ' ')) {
      handled = true;
      if (mode === 'play' && st && !st.done) doLaunch(Math.round(st.cursor));
      else if (mode === 'title') newRun(Math.min(li, save.unlocked - 1));
      else if (mode === 'end') document.getElementById('bAgain').click();
    }
    if (isKey(e, 'Escape', 'Escape')) { if (mode === 'play') openLevels(); }
    if (handled) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (isKey(e, 'ArrowLeft', 'a') || isKey(e, 'KeyA', 'a')) keys.L = 0;
    if (isKey(e, 'ArrowRight', 'd') || isKey(e, 'KeyD', 'd')) keys.R = 0;
  });

  function doLaunch(i) {
    if (!st || st.done || st.waves <= 0) return;
    G.launch(st, i);
  }

  function pxFromEvent(e) {
    var r = cv.getBoundingClientRect();
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H };
  }
  function onTap(e) {
    if (mode !== 'play' || !st || st.done) return;
    var p = pxFromEvent(e);
    var i = G.colAt(st, p.x);
    st.cursor = i;
    st.__cursorVisible = true;
    doLaunch(i);
    e.preventDefault();
  }
  cv.addEventListener('pointerdown', function (e) { onTap(e); }, { passive: false });
  cv.addEventListener('touchstart', function (e) { if (mode === 'play') e.preventDefault(); }, { passive: false });

  // ---------- 主循环 ----------
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastT) lastT = ts;
    var dt = (ts - lastT) / 1000;
    lastT = ts;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;

    if (mode === 'play' && st) {
      // 键盘准星
      if (keys.L || keys.R) {
        st.__cursorVisible = true;
        var mv = (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
        st.cursor = Math.max(0, Math.min(st.n - 1, st.cursor + mv * 16 * dt));
      }
      if (st.__cursorVisible) st.cursor = Math.max(0, Math.min(st.n - 1, st.cursor));

      // ① 先 update 产出事件
      G.update(st, dt);
      // ② 再读事件播音效（渲染层会清空 events，顺序不能反）
      for (var i = 0; i < st.events.length; i++) {
        var ev = st.events[i];
        if (ev.t === 'lock') sfxLock(ev.k);
        else if (ev.t === 'launch') sfxLaunch();
        else if (ev.t === 'chime') tone(PENTA[(ev.i * 2) % 5] + 12, 0.5, 'sine', 0.22);
        else if (ev.t === 'miss') sfxMiss();
        else if (ev.t === 'chainEnd' && ev.len >= 5) sfxBig(ev.len);
        else if (ev.t === 'refund') sfxRefund();
        else if (ev.t === 'tide' && ev.on) sfxTide();
      }
      // ③ 最后渲染（内部消费并清空 events）
      R.consume(st);
      R.draw(ctx, st, dt);
      syncHUD();

      if (st.done) {
        endTimer += dt;
        if (endTimer > 0.85) finish();
      }
    } else if (st) {
      R.draw(ctx, st, dt);
    }

    if (hintT > 0) {
      hintT -= dt;
      if (hintT <= 0) document.getElementById('hHint').classList.remove('on');
    }
  }

  // ---------- 结算 ----------
  function stars(n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += i < n ? '★' : '<span class="off">★</span>';
    return s;
  }
  function finish() {
    mode = 'end';
    running = false;
    var st2 = G.stars(st);
    var cleared = st.cleared;
    if (cleared) {
      if (save.stars[li] < st2) save.stars[li] = st2;
      if (save.best[li] < st.score) save.best[li] = st.score;
      if (li + 1 >= save.unlocked && li + 1 < G.LEVELS.length) save.unlocked = li + 2;
    }
    if (save.chain < st.maxChain) save.chain = st.maxChain;
    persist();

    document.getElementById('eTitle').textContent = cleared ? '极 光 满 帘' : '这 一 夜';
    document.getElementById('eStars').innerHTML = stars(cleared ? st2 : 0);
    var rows = [
      ['点亮', st.lit + ' / ' + st.n],
      ['得分', st.score],
      ['最大连锁', st.maxChain],
      ['发射', st.launches + ' 束'],
      ['历史最佳', save.best[li]],
      ['历史最长', save.chain]
    ];
    document.getElementById('eStats').innerHTML = rows.map(function (r) {
      return '<div><span>' + r[0] + '</span><b>' + r[1] + '</b></div>';
    }).join('');
    var v;
    if (cleared && st2 === 3) v = '你等到了那道最宽的涌浪，<br>然后从它的<b>左缘</b>起爆。';
    else if (cleared) v = '整条帘子都亮了。<br>下一次，试试<b>更靠左</b>一点起爆。';
    else v = '波束用完了，帘子还差几根。<br><b>等宽涌浪，点它的左缘</b>——它会替你跑完全程。';
    document.getElementById('eVerse').innerHTML = v;
    document.getElementById('bNext').style.display =
      (cleared && li + 1 < G.LEVELS.length) ? '' : 'none';
    document.getElementById('ovEnd').classList.add('on');
    if (cleared) sfxClear(); else sfxOver();
  }

  // ---------- 选关 ----------
  function openLevels() {
    mode = 'levels';
    hideAll();
    var list = document.getElementById('lvList');
    list.innerHTML = '';
    G.LEVELS.forEach(function (L, i) {
      var locked = i + 1 > save.unlocked;
      var d = document.createElement('div');
      d.className = 'lvcard' + (locked ? ' lock' : '');
      var s = save.stars[i];
      d.innerHTML = '<div class="n">第 ' + (i + 1) + ' 夜<small>' + L.n + ' 柱 · ' + L.waves + ' 束</small></div>' +
        '<div class="r"><div class="st">' + stars(s) + '</div>' +
        '<div class="bs">' + (save.best[i] ? '最佳 ' + save.best[i] : (locked ? '未解锁' : '未通过')) + '</div></div>';
      if (!locked) d.addEventListener('click', function () { newRun(i); });
      list.appendChild(d);
    });
    document.getElementById('ovLevels').classList.add('on');
  }

  // ---------- 按钮 ----------
  document.getElementById('bStart').addEventListener('click', function () {
    actx();
    newRun(Math.min(save.unlocked - 1, G.LEVELS.length - 1));
  });
  document.getElementById('bLevels').addEventListener('click', openLevels);
  document.getElementById('bBack').addEventListener('click', function () {
    mode = 'title'; hideAll(); document.getElementById('ovStart').classList.add('on');
  });
  document.getElementById('bAgain').addEventListener('click', function () { newRun(li); });
  document.getElementById('bNext').addEventListener('click', function () {
    newRun(Math.min(li + 1, G.LEVELS.length - 1));
  });
  document.getElementById('bLv2').addEventListener('click', openLevels);

  var mb = document.getElementById('mute');
  function paintMute() { mb.textContent = save.mute ? '✕' : '♪'; mb.style.color = save.mute ? '#5E7C92' : '#9FC4D8'; }
  mb.addEventListener('click', function (e) {
    e.stopPropagation();
    save.mute = !save.mute; persist(); paintMute();
    if (!save.mute) { actx(); tone(12, 0.16, 'sine', 0.3); }
  });
  paintMute();

  // ---------- 自适应（canvas CSS 固定 480×800，缩放只交给 #stage） ----------
  function fit() {
    var vw = wrap.clientWidth, vh = wrap.clientHeight;
    var k = Math.min(vw / W, vh / H);
    if (!isFinite(k) || k <= 0) k = 1;
    stage.style.transform = 'scale(' + k + ')';
    var dpr = window.devicePixelRatio || 1;
    var eff = Math.min(dpr * k, 2.1);
    var bw = Math.round(W * eff), bh = Math.round(H * eff);
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
    ctx.setTransform(eff, 0, 0, eff, 0, 0);
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });

  // ---------- 启动 ----------
  R.init();
  fit();
  st = G.newState(0, 20260907);   // 标题页背景也在呼吸
  mode = 'title';
  requestAnimationFrame(loop);

  window.__game = {
    get st() { return st; }, get mode() { return mode; }, get li() { return li; },
    G: G, R: R, save: save,
    newRun: newRun, openLevels: openLevels,
    launch: function (i) { return G.launch(st, i); },
    reset: function () { save.unlocked = 1; save.stars = [0, 0, 0, 0, 0]; save.best = [0, 0, 0, 0, 0]; save.chain = 0; persist(); }
  };
})();
</script>
</body>
</html>
