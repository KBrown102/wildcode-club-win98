<script>
(function(){
'use strict';
var G = window.MistFerry, MF = window.MF;
var W = G.W, H = G.H, P = G.P;
var STAGE_W = 600, STAGE_H = 880;

var cv = document.getElementById('cv');
var R = new MF.Render(cv);
var st = null, li = 0, seed = 20260908, running = false, last = 0;
var held = {}, memo = {};

/* ---------- 存档 ---------- */
var SKEY = 'mistferry.v1';
function load(){
  try{ var d = JSON.parse(localStorage.getItem(SKEY)||'{}');
    d.best = d.best||{}; d.unlocked = d.unlocked||1; d.mute = !!d.mute; return d; }
  catch(e){ return {best:{},unlocked:1,mute:false}; }
}
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(SAVE)); }catch(e){} }
var SAVE = load();

/* ---------- 音效（五声音阶） ---------- */
var AC = null, master = null, muted = SAVE.mute;
function ac(){
  if(AC) return AC;
  var C = window.AudioContext||window.webkitAudioContext; if(!C) return null;
  AC = new C(); master = AC.createGain(); master.gain.value = muted?0:0.5; master.connect(AC.destination);
  return AC;
}
function tone(freq, dur, type, vol, delay){
  var a = ac(); if(!a||muted) return;
  var t0 = a.currentTime + (delay||0);
  var o = a.createOscillator(), g = a.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol||0.16, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur, freq, vol, q){
  var a = ac(); if(!a||muted) return;
  var len = Math.max(1, Math.floor(a.sampleRate*dur));
  var buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  var src = a.createBufferSource(); src.buffer = buf;
  var bp = a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=q||1.1;
  var g = a.createGain(); g.gain.value = vol||0.10;
  src.connect(bp); bp.connect(g); g.connect(master); src.start();
}
var PENT = [0,2,4,7,9];
function pent(n){ var o = PENT[((n%5)+5)%5] + 12*Math.floor(n/5); return 261.63*Math.pow(2, o/12); }

function sfxPaddle(kind){ noise(kind==='B'?0.20:0.15, kind==='V'?420:760, 0.075, 0.9);
  tone(kind==='B'?196:220, 0.10, 'sine', 0.035); }
function sfxLand(note){
  var f = pent(note);
  tone(f, 1.5, 'sine', 0.16); tone(f*2, 1.1, 'sine', 0.06); tone(f*3, 0.7, 'sine', 0.025);
  noise(0.22, 1500, 0.05, 1.6);
}
function sfxBump(what){ tone(what==='rock'?84:66, 0.22, 'triangle', 0.13); noise(0.14, 240, 0.09, 0.7); }
function sfxFast(){ tone(150, 0.20, 'triangle', 0.09); noise(0.18, 500, 0.06, 0.8); }
function sfxVortex(){
  var a = ac(); if(!a||muted) return;
  var t0 = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(420,t0); o.frequency.exponentialRampToValueAtTime(120,t0+0.5);
  g.gain.setValueAtTime(0.11,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.55);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.6);
}
function sfxEnd(kind){
  var seq = kind==='clear' ? [0,2,4,7] : [4,2,0];
  for(var i=0;i<seq.length;i++) tone(pent(seq[i]), 1.2, 'sine', 0.11, i*0.17);
}

/* 事件 → 音效（必须在渲染层清空 events 之前消费） */
function playEvents(evs){
  for(var i=0;i<evs.length;i++){
    var e = evs[i];
    if(e.t==='paddle') sfxPaddle(e.kind);
    else if(e.t==='land') sfxLand(e.note);
    else if(e.t==='bump') sfxBump(e.what);
    else if(e.t==='fast') sfxFast();
    else if(e.t==='vortex') sfxVortex();
    else if(e.t==='end') sfxEnd(e.kind);
  }
}

/* ---------- 缩放 ---------- */
function fit(){
  var k = Math.min(window.innerWidth/STAGE_W, window.innerHeight/STAGE_H);
  if(k > 1.16) k = 1.16;
  document.getElementById('stage').style.transform = 'scale('+k+')';
  var eff = Math.min((window.devicePixelRatio||1)*k, 2.4);
  if(Math.abs(eff - (R.eff||0)) > 0.01){ R.resize(eff); if(st) R.bake(st.L, keyOf()); }
}
window.addEventListener('resize', fit);

/* ---------- HUD ---------- */
function keyOf(){ return li+'_'+seed; }
function syncHud(){
  if(memo.lv!==li){ memo.lv=li; document.getElementById('lvName').textContent = G.LEVELS[li].name; }
  if(memo.score!==st.score){ memo.score=st.score; document.getElementById('score').textContent = st.score; }
  var dc = st.landed+'/'+st.total;
  if(memo.dc!==dc){ memo.dc=dc; document.getElementById('dockCnt').textContent = dc; }
  if(memo.pw!==st.power || memo.mpw!==st.maxPower){
    memo.pw=st.power; memo.mpw=st.maxPower;
    document.getElementById('pwBar').firstChild.style.width =
      Math.max(0, Math.min(100, st.power/st.maxPower*100))+'%';
    document.getElementById('pwTxt').textContent = st.power+' / '+st.maxPower;
  }
}
function hint(txt, ms){
  var h = document.getElementById('hint'); h.textContent = txt; h.classList.add('show');
  clearTimeout(hint._t); hint._t = setTimeout(function(){ h.classList.remove('show'); }, ms||1800);
}

function show(id){ document.getElementById(id).classList.remove('hide'); }
function hide(id){ document.getElementById(id).classList.add('hide'); }

function buildGrid(){
  var gEl = document.getElementById('grid'); gEl.innerHTML='';
  for(var i=0;i<G.LEVELS.length;i++){
    (function(i){
      var b = document.createElement('button');
      var best = SAVE.best[i];
      var locked = (i+1) > SAVE.unlocked;
      b.innerHTML = '<span>'+(i+1)+'</span><i>'+(best?'★'.repeat(best.stars):(locked?'·':''))
        +'</i><small>'+(best?best.score:'-')+'</small>';
      b.disabled = locked;
      b.onclick = function(){ start(i); };
      gEl.appendChild(b);
    })(i);
  }
  var tot=0,n=0;
  for(var k in SAVE.best){ tot+=SAVE.best[k].score; n++; }
  document.getElementById('startBest').textContent = n
    ? ('已渡 '+n+' / '+G.LEVELS.length+' 关 · 累计 '+tot+' 分') : '尚未启程';
}

function start(i){
  li = i; st = G.newState(li, seed);
  R.resetFog(); R.bake(st.L, keyOf()); R.parts.length=0; R.texts.length=0;
  memo = {lv:-1,score:-1,dc:'',pw:-1,mpw:-1};
  hide('ovStart'); hide('ovEnd'); running = true;
  syncHud();
  hint('收桨等水阻，慢下来才靠得住', 2600);
}

var END_TXT = {
  clear:   {t:'渡完', s:'一江渡尽', l:'不必一直划。江自己会带你到该到的地方。'},
  exhaust: {t:'力竭', s:'桨力用尽，随波而下', l:'省下的每一桨，都是留给下一渡的。'},
  down:    {t:'顺流而下', s:'漂出了这一段江', l:'漂过去的不算白漂 —— 你已经认得这段水路。'}
};
function finish(){
  running = false;
  var r = st.result, e = END_TXT[r.kind]||END_TXT.down;
  var star = G.stars(li, r);
  document.getElementById('endTitle').textContent = e.t;
  document.getElementById('endSub').textContent = e.s;
  document.getElementById('endStars').textContent =
    '★★★'.slice(0,star) + '☆☆☆'.slice(0,3-star);
  var rows = [
    ['渡口', r.landed+' / '+r.total],
    ['最缓一靠', Math.round(r.softAvg*100)+'%'],
    ['剩余桨力', r.power],
    ['划桨', r.strokes+' 桨'],
    ['碰撞', r.bumps+' 次']
  ];
  if(r.bonus) rows.push(['省桨奖励', '+'+r.bonus]);
  if(r.pen) rows.push(['碰撞扣分', '−'+r.pen]);
  rows.push(['本渡得分', r.score]);
  document.getElementById('endStat').innerHTML =
    rows.map(function(x){ return '<span>'+x[0]+'</span><b>'+x[1]+'</b>'; }).join('');
  document.getElementById('endLine').textContent = e.l;

  var b = SAVE.best[li];
  if(!b || r.score > b.score) SAVE.best[li] = {score:r.score, stars:star};
  else if(star > (b.stars||0)) SAVE.best[li].stars = star;
  if(r.landed>=r.total && li+1 < G.LEVELS.length) SAVE.unlocked = Math.max(SAVE.unlocked, li+2);
  save();
  document.getElementById('btnNext').style.display =
    (r.landed>=r.total && li+1<G.LEVELS.length) ? '' : 'none';
  show('ovEnd');
}

/* ---------- 输入 ---------- */
var KMAP = {
  'ArrowLeft':'L','KeyA':'L','a':'L','A':'L',
  'ArrowRight':'R','KeyD':'R','d':'R','D':'R',
  'ArrowUp':'B','KeyW':'B','w':'B','W':'B',
  'ArrowDown':'V','KeyS':'V','s':'V','S':'V'
};
function kcode(e){ return e.code || e.key || ''; }
window.addEventListener('keydown', function(e){
  var k = KMAP[kcode(e)] || KMAP[e.key];
  if(!k) return;
  e.preventDefault();
  if(held[k]) return;
  held[k] = 1; doPaddle(k);
});
window.addEventListener('keyup', function(e){
  var k = KMAP[kcode(e)] || KMAP[e.key];
  if(k) held[k] = 0;
});
window.addEventListener('blur', function(){ held = {}; });

Array.prototype.forEach.call(document.querySelectorAll('#ctl button'), function(b){
  var k = b.getAttribute('data-k');
  function on(ev){ ev.preventDefault(); held[k]=1; b.classList.add('on'); doPaddle(k); }
  function off(){ held[k]=0; b.classList.remove('on'); }
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
cv.addEventListener('pointerdown', function(e){
  var rect = cv.getBoundingClientRect();
  var rel = (e.clientX - rect.left)/rect.width;
  var k = rel < 0.5 ? 'L' : 'R';
  held[k]=1; doPaddle(k);
});
cv.addEventListener('pointerup', function(){ held['L']=0; held['R']=0; });
cv.addEventListener('pointercancel', function(){ held['L']=0; held['R']=0; });

function doPaddle(k){ if(running && st) G.paddle(st, k); }

document.getElementById('btnRetry').onclick = function(){ start(li); };
document.getElementById('btnNext').onclick = function(){ start(Math.min(G.LEVELS.length-1, li+1)); };
document.getElementById('btnMenu').onclick = function(){ running=false; buildGrid(); hide('ovEnd'); show('ovStart'); };
document.getElementById('snd').onclick = function(){
  muted = !muted; SAVE.mute = muted; save();
  if(master) master.gain.value = muted?0:0.5;
  this.textContent = muted?'🔇':'🔊';
};
document.getElementById('snd').textContent = muted?'🔇':'🔊';

/* ---------- 主循环 ---------- */
function frame(ts){
  if(!last) last = ts;
  var dt = (ts - last)/1000; last = ts;
  if(!(dt>0)) dt = 0;
  if(dt>0.05) dt = 0.05;

  if(running && st){
    for(var k in held) if(held[k]) G.paddle(st, k);   // 按住 = 按节奏连划
    G.update(st, dt);
    playEvents(st.events);     // ① 音效
    R.feed(st);                // ② 粒子（会清空 events）
    R.draw(st, dt);            // ③ 渲染
    syncHud();
    if(st.phase === 'end') finish();
  } else if(st){
    R.step(dt); R.draw(st, dt);
  }
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
buildGrid();
var k0 = Math.min(window.innerWidth/STAGE_W, window.innerHeight/STAGE_H);
if(k0 > 1.16) k0 = 1.16;
R.resize(Math.min((window.devicePixelRatio||1)*k0, 2.4));
st = G.newState(0, seed);
R.bake(st.L, keyOf());
fit();
requestAnimationFrame(frame);

window.__game = {
  get st(){ return st; }, G: G, R: R,
  start: start, isRunning: function(){ return running; },
  paddle: function(k){ return G.paddle(st, k); },
  setLevel: function(i){ li=i; }, getLevel: function(){ return li; }
};
})();
</script>
