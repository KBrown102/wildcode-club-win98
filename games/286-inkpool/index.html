<script>
(function () {
  'use strict';
  var G = globalThis.InkPool, R = globalThis.InkRender;
  var W = 480, H = 820;
  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var KEY = 'inkpool286';

  /* ---------------- 存档 ---------------- */
  var save = { best: {}, unlocked: 1, mute: false, calm: false };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') { save.best = o.best || {}; save.unlocked = o.unlocked || 1; save.mute = !!o.mute; save.calm = !!o.calm; } }
  } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  /* ---------------- 音频 ---------------- */
  var ac = null, master = null;
  var PENT = [261.63, 293.66, 329.63, 392.00, 440.00];
  function audio() {
    if (ac) return ac;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      ac = new C();
      master = ac.createGain();
      master.gain.value = save.mute ? 0 : 0.5;
      master.connect(ac.destination);
    } catch (e) { ac = null; }
    return ac;
  }
  function pluck(f, dur, gain, type, delay) {
    if (!ac || save.mute) return;
    var t0 = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(), gn = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(gain, t0 + 0.010);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }
  function hiss(dur, freq, q, gain) {
    if (!ac || save.mute) return;
    var len = Math.max(1, Math.ceil(ac.sampleRate * dur));
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = ac.createBufferSource(); src.buffer = buf;
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    var gn = ac.createGain(); gn.gain.value = gain;
    src.connect(bp); bp.connect(gn); gn.connect(master);
    src.start();
  }
  function sfxPour(grade, amount, calm) {
    var f = PENT[grade % 5] * 2;
    for (var i = 0; i < Math.min(3, amount); i++) pluck(f * (1 + i * 0.004), 0.42, 0.16, 'sine', i * 0.06);
    hiss(0.16, calm ? 900 : 1500, 1.1, 0.10);
  }
  function sfxDeny() { pluck(103, 0.20, 0.13, 'triangle'); hiss(0.09, 320, 1.6, 0.06); }
  function sfxUnify() { pluck(523.25, 0.75, 0.13, 'sine'); pluck(659.25, 0.75, 0.09, 'sine', 0.05); pluck(783.99, 0.85, 0.07, 'sine', 0.10); }
  function sfxLift() { hiss(0.20, 2300, 0.9, 0.13); pluck(392.00, 0.30, 0.10, 'triangle'); }
  function sfxRelief() { pluck(329.63, 0.9, 0.11, 'sine'); pluck(440.00, 1.1, 0.08, 'sine', 0.12); }
  function sfxClear() {
    for (var i = 0; i < 5; i++) pluck(PENT[i] * 2, 1.1, 0.12, 'sine', i * 0.085);
    hiss(0.5, 700, 0.7, 0.07);
  }
  function sfxTap() { pluck(587.33, 0.14, 0.07, 'sine'); }

  /* ---------------- 状态 ---------------- */
  var st = G.create(1);
  var running = false, inMenu = true, lastT = 0, clearT = 0;

  /* ---------------- DOM ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var elLv = $('lv'), elMv = $('mv'), elTm = $('tm'), elLf = $('lf'), elDn = $('dn'), elTip = $('tip');
  var btnLift = $('btnLift'), btnCalm = $('btnCalm'), btnMute = $('btnMute');
  var ovStart = $('ovStart'), ovClear = $('ovClear'), ovAll = $('ovAll'), grid = $('grid');
  var LVN = ['第一池', '第二池', '第三池', '第四池', '第五池', '第六池', '第七池', '第八池'];

  function fmt(t) {
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function hud() {
    elLv.textContent = LVN[st.level - 1] || ('第' + st.level + '池');
    elMv.textContent = st.moves;
    elTm.textContent = fmt(st.time);
    elLf.textContent = st.lifts;
    elDn.textContent = G.doneCount(st) + '/' + st.ng;
    btnLift.textContent = '提笔 ' + st.lifts;
    btnLift.className = 'bbtn' + (st.liftMode ? ' on' : '') + (st.lifts <= 0 ? ' out' : '');
    btnCalm.className = 'bbtn' + (st.calmLock ? ' on' : '');
    var calm = G.isCalm(st);
    elTip.innerHTML = st.sel >= 0
      ? (calm ? '墨面正<b>静</b> · 这一笔是整注' : '墨面在<b>晃</b> · 只带得动半注')
      : (st.liftMode ? '提笔中 · 点一只盂取墨，再点一只放下（可叠异色）'
        : '点一只盂提起，再点一只倾过去');
  }

  /* ---------------- 选关网格 ---------------- */
  function starStr(n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += i < n ? '印' : '<span class="off">印</span>';
    return s;
  }
  function drawGrid() {
    var html = '';
    for (var i = 1; i <= G.LEVELS.length; i++) {
      var L = G.LEVELS[i - 1];
      var lock = i > save.unlocked;
      var b = save.best[i];
      html += '<button class="lc' + (lock ? ' lock' : '') + (i === save.unlocked ? ' cur' : '') + '" data-lv="' + i + '"' + (lock ? ' disabled' : '') + '>'
        + '<span class="n">' + i + '</span>'
        + '<span class="s">' + (b ? starStr(b.stars) : (lock ? '' : '<span class="off">印印印</span>')) + '</span>'
        + '<span class="b">' + L.g + '色 · ' + L.cap + '格</span>'
        + '</button>';
    }
    grid.innerHTML = html;
    Array.prototype.forEach.call(grid.querySelectorAll('.lc'), function (el) {
      el.addEventListener('click', function () {
        var lv = parseInt(el.getAttribute('data-lv'), 10);
        if (lv > save.unlocked) return;
        audio(); sfxTap();
        startLevel(lv);
      });
    });
  }

  /* ---------------- 流程 ---------------- */
  function startLevel(lv, seed) {
    st = G.create(lv, seed);
    st.calmLock = save.calm;
    R.setLevel(st);
    ovStart.classList.add('hide');
    ovClear.classList.add('hide');
    ovAll.classList.add('hide');
    inMenu = false; running = true; clearT = 0;
    hud();
  }
  function openMenu() {
    inMenu = true; running = false;
    drawGrid();
    ovClear.classList.add('hide');
    ovAll.classList.add('hide');
    ovStart.classList.remove('hide');
  }
  function onClear() {
    running = false;
    var s = G.stars(st);
    var prev = save.best[st.level];
    if (!prev || st.moves < prev.moves) save.best[st.level] = { stars: s, moves: st.moves, time: Math.round(st.time * 10) / 10 };
    else if (s > prev.stars) prev.stars = s;
    if (st.level >= save.unlocked && st.level < G.LEVELS.length) save.unlocked = st.level + 1;
    persist();
    $('clTitle').textContent = '匀 了';
    $('clStars').innerHTML = starStr(s);
    $('clMv').textContent = st.moves + ' 步';
    $('clTm').textContent = fmt(st.time);
    $('clLf').textContent = st.lifts + ' / ' + st.liftsMax;
    $('clRl').textContent = st.relief + ' 次';
    var LINES = [
      '有的墨非得分两次才肯匀。<br>不急。<br>它在等你手稳。',
      '少的那半注，还在原处。<br>它没跑。<br>只是还没轮到它。',
      '你以为在理墨。<br>其实墨也在理你。<br>一下，一下。',
      '匀了的池子不再呼吸。<br>剩下的还在晃。<br>那就再提一次笔。'
    ];
    $('clLine').innerHTML = LINES[(st.level - 1) % LINES.length];
    var b = save.best[st.level];
    $('clBest').textContent = b ? ('本池最少 ' + b.moves + ' 步') : '';
    $('btnNext').style.display = (st.level < G.LEVELS.length) ? '' : 'none';
    clearT = 0;
    sfxClear();
    setTimeout(function () { ovClear.classList.remove('hide'); }, 620);
  }

  /* ---------------- 输入 ---------------- */
  function tapAt(mx, my) {
    var i = R.hitTest(st, mx, my);
    G.tap(st, i);
  }
  function toLocal(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    audio();
    if (!running) return;
    var p = toLocal(e);
    tapAt(p.x, p.y);
    hud();
  });

  btnLift.addEventListener('click', function () {
    if (!running) return;
    audio();
    if (st.lifts <= 0) { sfxDeny(); return; }
    st.liftMode = !st.liftMode;
    if (st.liftMode) st.sel = -1;
    sfxTap(); hud();
  });
  btnCalm.addEventListener('click', function () {
    audio();
    st.calmLock = !st.calmLock;
    save.calm = st.calmLock; persist();
    sfxTap(); hud();
  });
  $('btnRedo').addEventListener('click', function () {
    if (!running) return;
    audio(); sfxTap();
    G.restart(st);
    R.setLevel(st);
    hud();
  });
  $('btnMenu').addEventListener('click', function () { audio(); sfxTap(); openMenu(); });
  btnMute.addEventListener('click', function () {
    audio();
    save.mute = !save.mute; persist();
    if (master) master.gain.value = save.mute ? 0 : 0.5;
    btnMute.textContent = save.mute ? '×' : '♪';
    if (!save.mute) sfxTap();
  });
  btnMute.textContent = save.mute ? '×' : '♪';

  $('btnGo').addEventListener('click', function () { audio(); sfxTap(); startLevel(Math.min(save.unlocked, G.LEVELS.length)); });
  $('btnNext').addEventListener('click', function () { audio(); sfxTap(); startLevel(Math.min(G.LEVELS.length, st.level + 1)); });
  $('btnAgain').addEventListener('click', function () { audio(); sfxTap(); startLevel(st.level); });
  $('btnBack').addEventListener('click', function () { audio(); sfxTap(); openMenu(); });
  $('btnBack2').addEventListener('click', function () { audio(); sfxTap(); openMenu(); });

  function keyOf(e) {
    var c = e.code || '', k = e.key || '';
    if (c === 'ArrowLeft' || k === 'ArrowLeft' || k === 'a' || k === 'A') return 'left';
    if (c === 'ArrowRight' || k === 'ArrowRight' || k === 'd' || k === 'D') return 'right';
    if (c === 'ArrowUp' || k === 'ArrowUp' || k === 'w' || k === 'W') return 'up';
    if (c === 'ArrowDown' || k === 'ArrowDown' || k === 's' || k === 'S') return 'down';
    if (k === 'Escape' || c === 'Escape') return 'esc';
    if (k === 'r' || k === 'R') return 'r';
    if (k === 'f' || k === 'F') return 'f';
    if (k === ' ') return 'space';
    if (k >= '1' && k <= '9') return 'num' + k;
    return null;
  }
  window.addEventListener('keydown', function (e) {
    var k = keyOf(e);
    if (!k) return;
    if (inMenu) {
      if (k === 'space' || k === 'up') { e.preventDefault(); audio(); sfxTap(); startLevel(Math.min(save.unlocked, G.LEVELS.length)); }
      return;
    }
    e.preventDefault();
    audio();
    if (k === 'left') { st.cur = (st.cur - 1 + st.np) % st.np; sfxTap(); }
    else if (k === 'right') { st.cur = (st.cur + 1) % st.np; sfxTap(); }
    else if (k === 'up' || k === 'space') { G.tap(st, st.cur); }
    else if (k === 'down') { if (st.sel >= 0) { st.sel = -1; st.events.push({ t: 'deselect' }); } }
    else if (k === 'esc') { st.sel = -1; st.liftMode = false; }
    else if (k === 'r') { G.restart(st); R.setLevel(st); }
    else if (k === 'f') { if (st.lifts > 0) { st.liftMode = !st.liftMode; if (st.liftMode) st.sel = -1; } }
    else if (k.indexOf('num') === 0) { var n = parseInt(k.slice(3), 10); if (n <= st.np) G.tap(st, n - 1); }
    hud();
  });

  /* ---------------- 缩放 ---------------- */
  var curEff = 0;
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var k = Math.min(vw / W, vh / H);
    stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
    var dpr = window.devicePixelRatio || 1;
    var eff = Math.min(3, Math.max(1, dpr * Math.min(1.5, Math.max(1, k))));
    if (Math.abs(eff - curEff) > 0.02) {
      curEff = eff;
      cv.width = Math.round(W * eff);
      cv.height = Math.round(H * eff);
      cv.style.width = W + 'px';
      cv.style.height = H + 'px';
      if (!window.__inkInit) { R.init(cv, eff); window.__inkInit = true; R.setLevel(st); }
      else R.setEff(eff);
    }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  /* ---------------- 主循环 ---------------- */
  function frame(ts) {
    var dt = lastT ? (ts - lastT) / 1000 : 0.016;
    lastT = ts;
    if (dt > 0.06) dt = 0.06;

    // ① 先 update（产出事件）
    if (running && st.phase === 'play') G.update(st, dt);
    else if (st.phase === 'play') st.breath = (st.breath + dt / G.BREATH_T) % 1;

    // ② 再读事件播音效
    for (var i = 0; i < st.events.length; i++) {
      var ev = st.events[i];
      if (ev.t === 'pour') sfxPour(ev.grade, ev.amount, ev.calm);
      else if (ev.t === 'liftMove') sfxLift();
      else if (ev.t === 'deny') sfxDeny();
      else if (ev.t === 'unify') sfxUnify();
      else if (ev.t === 'relief') sfxRelief();
      else if (ev.t === 'clear') { onClear(); }
    }

    // ③ 最后渲染（渲染层清空 events）
    R.draw(st, dt);

    if (running) hud();
    requestAnimationFrame(frame);
  }

  fit();
  drawGrid();
  hud();
  requestAnimationFrame(frame);

  // 探针
  window.__game = {
    st: function () { return st; },
    G: G, R: R,
    tap: function (i) { G.tap(st, i); hud(); },
    start: startLevel,
    save: save,
    setSel: function (i) { st.sel = i; },
    state: function () {
      return {
        level: st.level, np: st.np, cap: st.cap, ng: st.ng,
        pools: st.pools.map(function (p) { return p.slice(); }),
        sel: st.sel, cur: st.cur, liftMode: st.liftMode,
        moves: st.moves, time: st.time, lifts: st.lifts, breath: st.breath,
        phase: st.phase, done: G.doneCount(st), calm: G.isCalm(st),
        hasMove: G.hasMove(st)
      };
    }
  };
})();
</script>
