<script>
(function(){
  'use strict';
  var G = window.PaperGame, RR = window.PaperRender;
  var NUM = RR.NUM, PAPER = RR.PAPER;
  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var R = RR.create(cv);
  var ctx = cv.getContext('2d');

  var LS = {
    get: function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
    set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  var mute = LS.get('pc291.mute','0') === '1';
  var best = parseInt(LS.get('pc291.best','0'),10) || 0;
  var dex = parseInt(LS.get('pc291.dex','1'),10) || 1;   // bit1 = 一级

  // 今日纸样：每天一个固定种子，能练、能比
  function todaySeed(){
    var d = new Date();
    return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  }
  var SEED = todaySeed();
  document.getElementById('seedTxt').textContent = '#' + SEED;

  var st = null;

  /* ---------- 缩放：canvas CSS 尺寸固定，缩放只交给 #stage 的 transform ---------- */
  function fit(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var k = Math.min(vw/480, vh/800);
    stage.style.transform = 'scale(' + k + ')';
    var eff = Math.min((window.devicePixelRatio||1) * k, 2.4);
    cv.width = Math.round(480*eff); cv.height = Math.round(800*eff);
    cv.style.width = '480px'; cv.style.height = '800px';
    R.setScale(eff);
    R._eff = eff;
  }
  window.addEventListener('resize', fit);

  /* ---------- 音效：五声音阶 ---------- */
  var AC = null;
  function actx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
  var PENT = [0,2,4,7,9];
  function tone(semi, dur, vol, type){
    if(mute) return;
    var a = actx(); if(!a) return;
    if(a.state === 'suspended') a.resume();
    var f = 261.63 * Math.pow(2, semi/12);
    var o = a.createOscillator(), gn = a.createGain();
    o.type = type || 'triangle'; o.frequency.value = f;
    gn.gain.setValueAtTime(0, a.currentTime);
    gn.gain.linearRampToValueAtTime(vol, a.currentTime + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(gn); gn.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function semiOf(L){ var i = L-1; return PENT[i%5] + 12*Math.floor(i/5); }
  function noise(dur, vol){
    if(mute) return;
    var a = actx(); if(!a) return;
    if(a.state === 'suspended') a.resume();
    var n = Math.floor(a.sampleRate * dur);
    var b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    var s = a.createBufferSource(); s.buffer = b;
    var gn = a.createGain(); gn.gain.value = vol;
    s.connect(gn); gn.connect(a.destination); s.start();
  }

  /* ---------- HUD ---------- */
  var elScore = document.getElementById('score'), elBest = document.getElementById('best');
  var elDex = document.getElementById('dex'), elHeld = document.getElementById('held');
  var elNext = document.getElementById('nextChip'), elDots = document.getElementById('dots');
  var ovStart = document.getElementById('ovStart'), ovEnd = document.getElementById('ovEnd');

  var dexEls = [];
  for(var i=1;i<=7;i++){
    var d = document.createElement('div');
    d.className = 'dx'; d.textContent = NUM[i];
    d.style.background = PAPER[i];
    if(i>=4) d.style.color = 'rgba(255,250,240,.92)';
    elDex.appendChild(d); dexEls.push(d);
  }
  var dotEls = [];
  for(var j=0;j<3;j++){
    var t = document.createElement('div'); t.className='dot'; elDots.appendChild(t); dotEls.push(t);
  }
  function syncDex(){
    for(var i=1;i<=7;i++) dexEls[i-1].className = 'dx' + ((dex & (1<<(i-1))) ? ' on' : '');
  }
  function paintChip(el, L){
    if(!L){ el.className='chip empty'; el.textContent='—'; el.style.background='transparent'; return; }
    el.className='chip'; el.textContent = NUM[L];
    el.style.background = PAPER[L];
    el.style.color = L>=4 ? 'rgba(255,250,240,.92)' : 'rgba(80,60,30,.72)';
  }
  var memo = { score:-1, best:-1, next:-1, held:-1, holds:-1 };
  function syncHUD(){
    if(st.score !== memo.score){ elScore.textContent = st.score; memo.score = st.score; }
    var b = st.best > best ? st.best : best;
    if(b !== memo.best){ elBest.textContent = b; memo.best = b; }
    if(st.next !== memo.next){ paintChip(elNext, st.next); memo.next = st.next; }
    if(st.held !== memo.held){ paintChip(elHeld, st.held); memo.held = st.held; }
    if(st.holds !== memo.holds){
      for(var i=0;i<3;i++) dotEls[i].className = 'dot' + (i < st.holds ? '' : ' used');
      memo.holds = st.holds;
    }
  }

  /* ---------- 事件 → 音效 ---------- */
  function playEvents(evs){
    for(var i=0;i<evs.length;i++){
      var e = evs[i];
      if(e.t === 'place'){ noise(0.05, 0.10); }
      else if(e.t === 'merge'){
        tone(semiOf(Math.min(e.level,7)) + 12*Math.min(e.cascade-1,2), 0.30, 0.16, 'triangle');
        if(e.n >= 5) tone(semiOf(Math.min(e.level,7)) + 19, 0.34, 0.09, 'sine');
        if(e.capped) tone(24, 0.6, 0.14, 'sine');
      }
      else if(e.t === 'hold'){ tone(7, 0.10, 0.07, 'sine'); }
      else if(e.t === 'move'){ tone(0, 0.035, 0.035, 'sine'); }
      else if(e.t === 'over'){ endGame(); }
    }
  }

  /* ---------- 开局 / 收工 ---------- */
  function start(){
    st = G.create({ seed: SEED, best: best });
    R.reset();
    memo.score = -1; memo.best = -1; memo.next = -1; memo.held = -1; memo.holds = -1;
    syncDex(); syncHUD();
    ovStart.classList.add('hide');
    ovEnd.classList.add('hide');
  }
  function endGame(){
    if(st.score > best){ best = st.score; LS.set('pc291.best', String(best)); }
    var nd = dex;
    for(var L=2;L<=7;L++) if(st.made[L]) nd |= (1<<(L-1));
    if(nd !== dex){ dex = nd; LS.set('pc291.dex', String(dex)); }
    syncDex();
    // 缩略图：必须 drawImage 重画（cloneNode 不拷位图）
    var th = document.getElementById('thumb'), tc = th.getContext('2d');
    var g0 = RR.geom;
    tc.setTransform(1,0,0,1,0,0);
    tc.fillStyle = '#EDE2CF'; tc.fillRect(0,0,208,234);
    tc.drawImage(cv, (g0.BX-6)*R._eff, (g0.BY-6)*R._eff, (g0.BW+12)*R._eff, (g0.BH+12)*R._eff, 0, 0, 208, 234);
    document.getElementById('endScore').textContent = st.score;
    document.getElementById('endChain').textContent = '×' + st.bestCascade;
    document.getElementById('endLv').textContent = st.maxMade ? NUM[st.maxMade] : '一';
    document.getElementById('endBest').textContent = best;
    document.getElementById('endTail').textContent =
      st.score >= best && st.score > 0 ? '这一版，是你目前最好的一版。' : '纸不够了，就换一种贴法。';
    ovEnd.classList.remove('hide');
  }

  document.getElementById('btnStart').onclick = start;
  document.getElementById('btnRestart').onclick = start;
  document.getElementById('btnAgain').onclick = function(){ start(); };
  var bm = document.getElementById('btnMute');
  function paintMute(){ bm.textContent = mute ? '✕' : '♪'; bm.style.opacity = mute ? .5 : 1; }
  bm.onclick = function(e){ e.stopPropagation(); mute = !mute; LS.set('pc291.mute', mute?'1':'0'); paintMute(); if(!mute) tone(12,0.14,0.09,'sine'); };
  paintMute();

  /* ---------- 输入 ---------- */
  function keyOf(e){ return e.code || e.key || ''; }
  window.addEventListener('keydown', function(e){
    if(!st || st.over) { if(keyOf(e)==='Enter') start(); return; }
    var k = keyOf(e), kk = (e.key||'').toLowerCase();
    if(k==='ArrowLeft'||kk==='a'){ G.moveCol(st,-1); e.preventDefault(); }
    else if(k==='ArrowRight'||kk==='d'){ G.moveCol(st,1); e.preventDefault(); }
    else if(k==='ArrowDown'||kk==='s'||k==='Space'||kk===' '){ G.drop(st); e.preventDefault(); }
    else if(k==='ArrowUp'||kk==='w'){ G.hold(st); e.preventDefault(); }
    else if(kk==='r'){ start(); }
  }, {passive:false});

  function colAt(clientX, clientY){
    var r = stage.getBoundingClientRect();
    var x = (clientX - r.left) / (r.width/480);
    var y = (clientY - r.top) / (r.height/800);
    if(y < 90 || y > 626) return -1;
    var c = Math.floor((x - RR.geom.BX) / RR.geom.CELL);
    if(c < 0) c = 0; if(c > 7) c = 7;
    return c;
  }
  stage.addEventListener('pointerdown', function(e){
    if(!st || st.over) return;
    if(e.target && e.target.tagName === 'BUTTON') return;
    var c = colAt(e.clientX, e.clientY);
    if(c < 0) return;
    G.setCol(st, c);
    G.drop(st);
    e.preventDefault();
  }, {passive:false});

  /* ---------- 主循环：① update → ② 读 events 播音效 → ③ 渲染（渲染层清空 events） ---------- */
  var last = 0;
  function frame(now){
    if(!last) last = now;
    var dt = (now - last)/1000; last = now;
    if(!(dt>0)) dt = 0;
    if(dt > 0.05) dt = 0.05;
    if(st){
      G.update(st, dt);          // ①
      playEvents(st.events);     // ②
      R.consume(st);             // ③ 生成粒子（并清空 events）
      R.draw(st, dt);
      syncHUD();
    }
    requestAnimationFrame(frame);
  }

  fit();
  st = G.create({ seed: SEED, best: best });
  syncDex(); syncHUD();
  requestAnimationFrame(frame);

  window.__game = {
    get st(){ return st; },
    G: G, R: R, start: start,
    seed: SEED,
    colAt: colAt,
    fit: fit
  };
})();
</script>
</body>
